version: '3.8'

# ==============================================================================
# FOOTBALL MEDIA PLATFORM — PRODUCTION DOCKER COMPOSE CONFIGURATION
# ==============================================================================

services:
  # 1. Next.js Standalone Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fmp_app_prod
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      APP_URL: ${APP_URL:-https://football.example.com}
      DATABASE_URL: postgresql://${POSTGRES_USER:-fmp_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-fmp_production}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      AUTH_SECRET: ${AUTH_SECRET}
      FOOTBALL_DATA_PROVIDER: ${FOOTBALL_DATA_PROVIDER:-mock}
      FOOTBALL_DATA_API_KEY: ${FOOTBALL_DATA_API_KEY:-}
      AI_API_PROVIDER: ${AI_API_PROVIDER:-mock}
      AI_API_KEY: ${AI_API_KEY:-}
      KYC_PROVIDER: ${KYC_PROVIDER:-mock-kyc-provider}
      KYC_WEBHOOK_SECRET: ${KYC_WEBHOOK_SECRET:-}
      PAYOUT_PROVIDER: ${PAYOUT_PROVIDER:-mock-payout-provider}
      PAYOUT_WEBHOOK_SECRET: ${PAYOUT_WEBHOOK_SECRET:-}
      CRON_SECRET: ${CRON_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fmp_internal_network

  # 2. PostgreSQL 16 Database (Internal only, not exposed on public ports)
  postgres:
    image: postgres:16-alpine
    container_name: fmp_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fmp_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-fmp_production}
    volumes:
      - fmp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fmp_admin} -d ${POSTGRES_DB:-fmp_production}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fmp_internal_network

  # 3. Redis 7 Ephemeral Cache (Internal only, protected with password)
  redis:
    image: redis:7-alpine
    container_name: fmp_redis_prod
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - fmp_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fmp_internal_network

networks:
  fmp_internal_network:
    driver: bridge

volumes:
  fmp_postgres_data:
    driver: local
  fmp_redis_data:
    driver: local
