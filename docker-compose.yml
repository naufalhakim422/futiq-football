version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fmp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fmp_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fmp_secret_pass_dev}
      POSTGRES_DB: ${POSTGRES_DB:-fmp_dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fmp_admin} -d ${POSTGRES_DB:-fmp_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fmp_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-fmp_redis_pass_dev}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-fmp_redis_pass_dev}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
